[workspace]
members = [
    "crates/trace-check",
    "crates/trace-check-secret",
    "crates/trace-check-test",
    "crates/trace-check-macros",
    "crates/cargo-trace-check",
    "examples/mac-compare",
    "examples/table-lookup",
    "examples/consumer-crate",
    "examples/crypto-library",
    "examples/legacy-branch-demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The traced example must be built with a fixed, optimized profile: the whole
# experiment is a claim about one specific compiled artifact, so the profile is
# part of the pinned configuration and must not vary between runs.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Native Memcheck analysis needs production-like optimization *and* symbols: a
# finding without a source location is not actionable. `panic = "unwind"` is
# kept here because the native harnesses are ordinary test binaries.
[profile.memcheck]
inherits = "release"
debug = true
strip = false
panic = "unwind"
