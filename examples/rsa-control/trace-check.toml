# M11.6 positive control.
#
# Both contracts are expected to be detected. They calibrate the audit: a tool
# that cannot see a documented, externally reported secret-dependent operation
# has nothing useful to say about a clean result on anything else.
schema_version = 1
description = "The modular exponentiation RUSTSEC-2023-0071 concerns, in rsa 0.9.10."

[check."rsactl::modpow_secret_exponent"]
description = "BigUint::modpow with a secret exponent, modulo a committed 1024-bit modulus"
rationale = "the shape of an RSA private-key operation, and the arithmetic layer the Marvin advisory is about. Total over both arguments, so generated bytes are valid inputs and no finding can be an artifact of a violated precondition. Expected detected: the advisory says the timing depends on the private key, and the control is that trace-check agrees without being told"
cases = 32
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."rsactl::modpow_secret_base"]
description = "the same exponentiation with the base secret and the exponent public"
rationale = "a separate claim: freedom from exponent-dependent behaviour does not imply freedom from base-dependent behaviour. Measured INCONCLUSIVE, and the detail matters: the run *did* find an attributed secret-dependent branch in num-bigint-dig's length normalization, and then declined to conclude because 25 further undefined-value uses could not be traced to the marked secret. Fail-closed, with a real finding inside it; docs/audits/controls.md has both"
cases = 32
expectation = "analyzer-regression"
expected_outcome = "INCONCLUSIVE"
