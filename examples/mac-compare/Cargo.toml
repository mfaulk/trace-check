[package]
name = "mac-compare"
description = "MAC authentication-tag comparison variants, exported for WASM tracing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# cdylib is the traced artifact; rlib lets the host test suite check that every
# variant agrees on the authentication decision.
[lib]
crate-type = ["cdylib", "rlib"]

# Gated so `cargo build -p mac-compare --target wasm32-unknown-unknown` still
# builds only the cdylib: a harness `main` would not compile under no_std, and
# M1's traced artifact must stay byte-identical.
[[bin]]
name = "mac-compare-native"
path = "src/bin/native_harness.rs"
required-features = ["native-harness"]

[features]
native-harness = ["dep:trace-check-secret"]

[dependencies]
subtle = { version = "2.6", default-features = false }
trace-check-secret = { path = "../../crates/trace-check-secret", optional = true }
