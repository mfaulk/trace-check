# Check settings for the crypto-bigint audit adapters.
#
# What is NOT here: which parameters are secret. That comes from
# `#[constant_time(secret = …)]` on the adapter itself. Configuration decides
# only *how* each declaration is analyzed, never what it claims.
#
# `expected_outcome` is a regression fixture, never an input to the decision.
# The six controls below are expected to be *detected*; if one of them ever
# stops being detected, the gate that makes a clean result on a real operation
# meaningful has quietly stopped working, and that must surface as an unmet
# expectation rather than as a passing run.
schema_version = 1
description = "Audit adapters over RustCrypto crypto-bigint 0.7.10, with the M9.1 propagation controls."

# ------------------------------------------------------------------
# Target A — the real operation. These are the contracts whose clean
# result is the audit evidence, and they are only worth anything
# because the controls below are detected.
# ------------------------------------------------------------------

[check."cbaudit::add::wrapping_add_secret_left"]
description = "U256::wrapping_add with a secret left operand and a public right"
rationale = "defined for every pair of 256-bit values, so unrestricted generated operands are valid inputs and a finding cannot be an artifact of violating a precondition. The compiled adapter contains the library's own from_be_slice, carrying_add chain and new_be -- see docs/audits/crypto-bigint/integration-report.md"

[check."cbaudit::add::wrapping_add_both_secret"]
description = "the same operation with both operands secret"
rationale = "a separate claim, not a separate implementation: safety for a public operand does not imply safety for a secret one"

# ------------------------------------------------------------------
# Target B — constant-time selection. Read with
# `controls::branch_selected`, which is the same function written with
# a branch and is expected to be detected.
# ------------------------------------------------------------------

[check."cbaudit::select::ct_select"]
description = "U256 selection through the library's CtSelect, with all three inputs secret"
rationale = "the adapter's one obligation is to build the Choice without branching, and `Choice::from_u8_lsb` is `value & 1`. The selection itself is the library's, which goes per-limb through `Limb::select` and the `cmov` crate -- a conditional move, so no branch and no secret-derived address. `choice` is a secret byte with two meaningful values and 256 valid ones; the generated corpus supplies all of them, and `only_the_low_bit_of_the_choice_matters` is the functional test that the other 254 are not a different function"

# ------------------------------------------------------------------
# Target C — Montgomery modular multiplication modulo the P-256 prime.
# ------------------------------------------------------------------

[check."cbaudit::monty::mul_secret_left"]
description = "ConstMontyForm::mul modulo the P-256 prime, secret left operand"
rationale = "exercises multi-limb multiplication, carry propagation, Montgomery representation and modular reduction at once. `ConstMontyForm::new` multiplies by R^2 mod p and so reduces its argument, which is why every 256-bit value is a valid input and the adapter carries no validity branch"

[check."cbaudit::monty::mul_both_secret"]
description = "the same operation with both operands secret"
rationale = "the configuration a field multiplication in a scalar multiplication actually sees, where neither operand is public"

# ------------------------------------------------------------------
# M9.1 controls. Each is expected to be detected, and each names the
# way of being wrong it rules out.
# ------------------------------------------------------------------

[check."cbaudit::controls::pre_decode_first_byte"]
description = "control B1: a branch on secret[0] before any decoding"
rationale = "necessary but insufficient. It shows the harness marked the array; it shows nothing about crypto-bigint, because the secret never reaches it"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::decoded_high_limb_branch"]
description = "control B2: a branch on the decoded value's most significant limb, secret[0..8]"
rationale = "the first control that is about propagation rather than marking: the branch is driven by a Word the library produced from the secret bytes"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::decoded_interior_limb_branch"]
description = "control B3: a branch on an interior limb, secret[8..16]"
rationale = "middle limbs are where a partial marking mistake hides -- a harness that marked the first and last eight bytes passes B2 and B4 and fails only here"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::decoded_last_byte_branch"]
description = "control B4: a branch on secret[31] alone, through the least significant limb"
rationale = "isolating the final byte is what distinguishes complete marking from marking that merely covers the leading bytes or the wrong width"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::carry_branch"]
description = "control B5: a branch on the carry the library itself produced"
rationale = "carrying_add is upstream code and the carry is its return value, so this follows a secret through multi-limb propagation rather than through decoding alone"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::decoded_address_probe"]
description = "control B6: a secret-derived load address after decoding"
rationale = "every secret executes the same instructions here, so a control-flow-only analysis reports it clean. It is the evidence that the address half of the observation model also survives decoding"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::branch_selected"]
description = "control B7: Target B's selection written with a branch instead of CtSelect"
rationale = "the same function as `select::ct_select`, written the way a developer reaches for first. A checker that cannot tell these two apart cannot say anything useful about constant-time selection, so this pair is the most direct demonstration the milestone produces"
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[check."cbaudit::controls::public_operand_branch"]
description = "negative control: a branch on the public operand only"
rationale = "both compared executions share their public inputs, so this is not a leak. A finding here would be wrong in the direction that makes the tool useless, and it is what separates `tracks the declared secret` from `complains about any branch`"

# ------------------------------------------------------------------
# M9.6 — bounded relational verification of the same contracts.
#
# A bounded result applies only to the compiled verification artifact,
# the declared input domain, the depth bound and the observation
# model. It is not a proof about the optimized production library in
# arbitrary calling contexts.
#
# The measurement that shaped this section: relational verification of
# *branchless* code is cheap no matter how wide the arithmetic is. The
# cost scales with the number of paths and observations, not with the
# size of the symbolic terms -- the analyzer never has to reason about
# what a 256-bit product equals, only about whether any address or
# branch condition depends on the secret. 256-bit Montgomery
# multiplication completes in seconds for exactly that reason.
# ------------------------------------------------------------------

[verify."cbaudit::add::wrapping_add_secret_left"]
description = "branchless 256-bit addition, secret left operand"
rationale = "256 symbolic secret bits, but the operation is a four-limb add/adc chain with no branch, so there is one path to explore"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

[verify."cbaudit::add::wrapping_add_both_secret"]
description = "the same, with 512 symbolic secret bits"
rationale = "doubling the symbolic domain does not add paths, which is the point of the measurement"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

[verify."cbaudit::select::ct_select"]
description = "the library's constant-time selection, 520 symbolic secret bits"
rationale = "the real question was whether the analyzer models the `cmov` the selection compiles to. It does"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

[verify."cbaudit::monty::mul_secret_left"]
description = "256-bit Montgomery multiplication and reduction"
rationale = "the target M9's plan expected to be prohibitive. It is not: the code is branchless, so there is one path and the work is discharging per-observation queries"
max_depth = 200000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

[verify."cbaudit::monty::mul_both_secret"]
description = "the same, with both operands secret"
rationale = "the configuration a field multiplication inside a scalar multiplication actually sees"
max_depth = 200000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

# The controls, from the symbolic side. These matter more here than the
# clean results do: a VERIFIED_BOUNDED on one of them would mean the
# secret stopped being symbolic somewhere in the decode, and then every
# clean result above would be worthless.

[verify."cbaudit::controls::pre_decode_first_byte"]
description = "control B1: a branch on secret[0] before decoding"
rationale = "necessary but insufficient -- it shows the harness made the array symbolic, nothing more"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::decoded_high_limb_branch"]
description = "control B2: a branch on the decoded most significant limb"
rationale = "the first control that is about propagation: the branch is on a Word the library produced"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::decoded_interior_limb_branch"]
description = "control B3: a branch on an interior limb"
rationale = "where a partial marking mistake would hide"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::decoded_last_byte_branch"]
description = "control B4: a branch on secret[31] alone"
rationale = "isolating the final byte separates complete marking from marking the leading bytes"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::carry_branch"]
description = "control B5: a branch on the carry the library returned"
rationale = "the strongest propagation control -- the branched-on value is a return value of upstream code"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::decoded_address_probe"]
description = "control B6: a secret-derived load address after decoding"
rationale = "one path, no branch, so only the memory-access half of the model can see this"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::branch_selected"]
description = "control B7: selection written with a branch instead of CtSelect"
rationale = "the pair to `select::ct_select` above: same function, one branchless and verified, one branched and detected"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "LEAK_DETECTED"

[verify."cbaudit::controls::public_operand_branch"]
description = "negative control: a branch on the public operand only"
rationale = "public inputs are symbolic and held equal between the paired executions, so branching on one is not a leak. A finding here would be wrong in the direction that makes the tool useless"
max_depth = 20000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"
