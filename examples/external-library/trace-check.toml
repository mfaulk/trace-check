schema_version = 1
description = "Verification settings for a library outside the trace-check workspace."

[verify."external_library::select"]
description = "constant-time selection between two words"
rationale = "the choice is applied as a full-width mask, so neither secret reaches a branch or an address"
max_depth = 4000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"

[verify."external_library::digest_nibble"]
description = "vulnerable: the secret's low nibble selects a load address"
rationale = "every secret executes the same instructions, so only an address-aware analysis can see this"
max_depth = 4000
checks = ["control-flow", "memory-access"]
# Stated explicitly as of M10.1. This crate has no `[check]` table, which was
# where the security-contract/analyzer-regression split lived, so there was no
# way to say that detecting this planted leak is the fixture *passing* -- and a
# security contract declaring that it leaks is a contradiction enforcement must
# never be asked to resolve. Without this line the configuration is now refused
# at load, which is the intended migration: loud, not silent.
expectation = "analyzer-regression"
expected_outcome = "LEAK_DETECTED"

[verify."external_library::mix_when"]
description = "selection driven by a public bool, whose domain the generator restricts"
rationale = "the secret is consumed by arithmetic only; the branch is on a public input, which both compared executions share. The generated `<= 1` constraint is what keeps the analyzed domain to Rust's valid bool values"
max_depth = 4000
checks = ["control-flow", "memory-access"]
expected_outcome = "VERIFIED_BOUNDED"
