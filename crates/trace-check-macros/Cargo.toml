[package]
name = "trace-check-macros"
description = "Attribute macros for trace-check constant-time contracts and tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["constant-time", "side-channel", "security", "testing"]
categories = ["cryptography", "development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
