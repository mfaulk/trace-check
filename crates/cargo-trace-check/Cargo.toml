[package]
name = "cargo-trace-check"
description = "Cargo subcommand running constant-time checks under Valgrind Memcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cargo-trace-check"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0"

[dependencies]
trace-check = { path = "../trace-check" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
