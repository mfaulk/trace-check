[package]
name = "cargo-trace-check"
description = "Cargo subcommand running constant-time checks under Valgrind Memcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["constant-time", "side-channel", "security", "testing"]
categories = ["cryptography", "development-tools::testing"]

[[bin]]
name = "cargo-trace-check"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[dependencies]
trace-check = { path = "../trace-check", version = "=0.1.0" }
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
