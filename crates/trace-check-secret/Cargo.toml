[package]
name = "trace-check-secret"
description = "Mark Rust data as secret for Valgrind Memcheck secret-dependency analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["constant-time", "side-channel", "security", "testing"]
categories = ["cryptography", "development-tools::testing"]

[build-dependencies]
cc = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(trace_check_no_valgrind)"] }
