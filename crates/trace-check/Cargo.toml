[package]
name = "trace-check"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["constant-time", "side-channel", "security", "testing"]
categories = ["cryptography", "development-tools::testing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
toml = "1.1.8"
wasmparser = "0.240"

# The M6 generated-harness tests assert against the control symbols the
# generated harness calls, so they take the constants from the crate that
# defines them rather than restating the strings.
[dev-dependencies]
trace-check-test = { path = "../trace-check-test", version = "=0.1.0" }
