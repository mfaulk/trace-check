[package]
name = "trace-check"
description = "Differential execution-trace analysis for secret-dependent control flow in compiled WASM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasmparser = "0.240"
