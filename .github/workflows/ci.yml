name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Instruction offsets and the trace grammar are specific to this release.
  WABT_VERSION: "1.0.42"
  WABT_SHA256: "84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131"

jobs:
  check:
    name: Linux (pinned toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the wasm32 target.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install WABT ${{ env.WABT_VERSION }}
        run: |
          set -euo pipefail
          archive="wabt-${WABT_VERSION}-linux-x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/${archive}"
          echo "${WABT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify the backend version
        run: |
          test "$(wasm-interp --version)" = "${WABT_VERSION}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A missing backend must fail rather than silently skip the end-to-end tests.
      - name: Test
        env:
          TRACE_CHECK_REQUIRE_BACKEND: "1"
        run: cargo test --workspace --all-features

      - name: Reproduce the demonstration
        run: cargo run --locked --release -p trace-check -- demo mac-compare

      - name: Emit the JSON report
        run: |
          cargo run --locked --release -p trace-check -- demo mac-compare --format json \
            > mac-compare-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: mac-compare-report
          path: mac-compare-report.json
