name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Instruction offsets and the trace grammar are specific to this release.
  WABT_VERSION: "1.0.42"
  WABT_SHA256: "84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131"
  # Must match trace_check::symbolic::ANALYZER_IMAGE; a test asserts the digest
  # form, and ci/verify-m4-symbolic.py asserts the report agrees with this.
  ANALYZER_IMAGE: "docker.io/binsec/binsec@sha256:19a0ff4b0278906bd6f00a5752cab19e8cad7153715cecf32d4f885826f62967"

jobs:
  check:
    name: Linux (pinned toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, the wasm32 target and the
      # llvm-tools component M7's coverage feedback reads.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The tools must come from *this* toolchain: a system LLVM of another
      # version cannot read this compiler's profiles, and reading the wrong
      # thing quietly is worse than not reading it.
      - name: Verify the toolchain's LLVM tools
        run: |
          set -euo pipefail
          bin="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          test -x "$bin/llvm-profdata" || { echo "llvm-profdata is missing"; exit 1; }
          test -x "$bin/llvm-cov" || { echo "llvm-cov is missing"; exit 1; }
          "$bin/llvm-cov" --version | grep -F "rust-$(rustc --version | cut -d' ' -f2)"

      # Ubuntu's valgrind package ships the client-request headers, which the
      # trace-check-secret shim needs at build time, as well as the binary.
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          test -f /usr/include/valgrind/memcheck.h

      - uses: Swatinem/rust-cache@v2

      - name: Install WABT ${{ env.WABT_VERSION }}
        run: |
          set -euo pipefail
          archive="wabt-${WABT_VERSION}-linux-x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/${archive}"
          echo "${WABT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify the backend version
        run: |
          test "$(wasm-interp --version)" = "${WABT_VERSION}"

      # examples/symbolic is not a Cargo package -- it is compiled directly by
      # rustc -- so cargo fmt does not reach it.
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check examples/symbolic/src/targets.rs
          rustfmt --edition 2021 --check examples/external-library/src/lib.rs
          # Not tests/vectors/generated.rs: it is reached through `include!`,
          # which rustfmt does not follow, and reformatting it would put the
          # committed fixture out of step with its generator.
          rustfmt --edition 2021 --check examples/crypto-bigint-audit/src/*.rs
          rustfmt --edition 2021 --check examples/crypto-bigint-audit/tests/functional.rs

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Outside the workspace, so `--workspace` does not reach it. `--all-targets`
      # on purpose: its contracts say `dynamic = false`, so an annotated library
      # whose only dependency is the macro crate must still build its own test
      # targets. Adding a verification annotation must not break `cargo test`.
      - name: Clippy the out-of-workspace example
        run: |
          cargo clippy --locked --all-targets \
            --manifest-path examples/external-library/Cargo.toml -- -D warnings

      - name: An annotated library still builds its own test suite
        run: |
          cargo test --locked --all-targets \
            --manifest-path examples/external-library/Cargo.toml

      # M9 level 1: the audit crate is lint-clean against the real dependency,
      # and its functional tests pass. No side-channel result in M9 is
      # interpreted before these do -- an adapter that decodes the wrong byte
      # order or consumes part of the result leaves trace-check analyzing
      # something that is not the operation the contract names.
      - name: Clippy the crypto-bigint audit adapters
        run: |
          cargo clippy --locked --all-targets \
            --manifest-path examples/crypto-bigint-audit/Cargo.toml -- -D warnings

      # The fixture must be what the generator produces. A hand-edited vector
      # would be an oracle that agrees with the adapter by construction, which
      # is the one thing an independent oracle must not be.
      - name: The oracle fixture matches its generator
        run: python3 ci/gen-m9-vectors.py --check

      - name: The audit adapters compute the right arithmetic
        run: |
          cargo test --locked --all-targets \
            --manifest-path examples/crypto-bigint-audit/Cargo.toml

      # A missing backend must fail rather than silently skip the end-to-end
      # tests. The fast suite runs first so an ordinary regression surfaces
      # before the slow instrumented tests.
      - name: Test (fast)
        env:
          TRACE_CHECK_REQUIRE_BACKEND: "1"
        run: cargo test --workspace --all-features --lib --bins

      - name: Test (integration and instrumented)
        env:
          TRACE_CHECK_REQUIRE_BACKEND: "1"
        run: cargo test --workspace --all-features --tests

      # Tier 0 + Tier 1. The baseline gate is active because the baseline file
      # is committed, so a toolchain change that alters the compiled shape of a
      # screened function fails here rather than passing unnoticed.
      - name: Screen the artifact (static)
        run: cargo run --locked --release -p trace-check -- screen mac-compare

      # M2: native secret-dependency analysis. Must detect both the early-exit
      # comparison and the secret-indexed memory access while accepting the
      # constant-time implementations.
      - name: Analyze native code (Memcheck)
        run: cargo run --locked --release -p trace-check -- native

      # M3: the developer-facing workflow. The consumer crate deliberately
      # contains vulnerable implementations, so a full run exits 1 by design;
      # the filtered run is the one that must exit 0.
      - name: Constant-time checks pass for the clean cases
        working-directory: examples/consumer-crate
        run: cargo run --locked --release -p cargo-trace-check -- test --filter constant_time

      - name: Constant-time checks detect the vulnerable cases
        working-directory: examples/consumer-crate
        run: |
          set +e
          cargo run --locked --release -p cargo-trace-check -- test --format json \
            > "$GITHUB_WORKSPACE/m3-consumer.json"
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "expected exit 1 (leak detected), got $code"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/ci/verify-m3-consumer.py" \
            "$GITHUB_WORKSPACE/m3-consumer.json"

      # Regression coverage for the reviewed discovery and coverage defects.
      # The hazard crate is outside the workspace because its ordinary unit
      # test fails by design.
      - name: Discovery does not execute ordinary tests
        run: |
          rm -f /tmp/trace-check-discovery-hazard-sentinel
          cargo run --locked --release -p cargo-trace-check -- list \
            --manifest-path examples/discovery-hazard/Cargo.toml
          if [ -f /tmp/trace-check-discovery-hazard-sentinel ]; then
            echo "discovery executed an ordinary unit test"
            exit 1
          fi

      - name: An untested contract fails the run
        working-directory: examples/consumer-crate
        run: |
          set +e
          cargo run --locked --release -p cargo-trace-check -- test \
            --features untested-contract --filter verify_tag_is_constant_time
          code=$?
          set -e
          test "$code" = "2" || { echo "expected exit 2 (incomplete), got $code"; exit 1; }

      # M5's library, dynamically. The same annotated functions that
      # `cargo trace-check verify` analyzes symbolically. The library
      # deliberately contains vulnerable implementations, so a full run exits 1
      # by design and the filtered run is the one that must exit 0.
      - name: The library's clean contracts pass dynamically
        working-directory: examples/crypto-library
        run: cargo run --locked --release -p cargo-trace-check -- test --filter is_constant_time

      - name: The library's vulnerable contracts are detected dynamically
        working-directory: examples/crypto-library
        run: |
          set +e
          cargo run --locked --release -p cargo-trace-check -- test
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1 (leak detected), got $code"; exit 1; }

      # M6 and M7: generated constant-time testing, with coverage-guided
      # exploration where the library's configuration enables it. No
      # hand-written #[ct_test] and no container -- the annotation and the
      # signature are the whole input.
      #
      # One authoritative run, two validators checking different properties of
      # it: verify-m6-generated.py checks the controls, the corpus
      # fingerprint, boundary coverage and every declared outcome;
      # verify-m7-explore.py checks the discovery-specific evidence. Running
      # the command twice would have measured the same thing twice.
      #
      # Exits 0 with the library's own configuration: its clean contracts are
      # security contracts that pass, and its deliberately vulnerable ones are
      # declared `analyzer-regression`, so detecting their planted leaks is
      # those fixtures passing. `--ci` additionally refuses a run that skipped
      # any configured contract.
      - name: Every configured contract is checked with generated inputs
        working-directory: examples/crypto-library
        run: |
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-configured --ci --format json \
            > "$GITHUB_WORKSPACE/m6-generated.json"
          python3 "$GITHUB_WORKSPACE/ci/verify-m6-generated.py" \
            "$GITHUB_WORKSPACE/m6-generated.json"
          python3 "$GITHUB_WORKSPACE/ci/verify-m7-explore.py" \
            "$GITHUB_WORKSPACE/m6-generated.json"

      # The policy split, asserted rather than assumed. The *same* function
      # that passes above as an analyzer-regression fixture must fail when it is
      # declared as a security contract: the only difference is the
      # configuration in force.
      - name: A leak in a declared security contract fails the build
        working-directory: examples/crypto-library
        run: |
          set -euo pipefail
          printf 'schema_version = 1\n\n[check."crypto::lookup::substitute_mode"]\n' \
            > /tmp/m6-security.toml
          set +e
          cargo run --locked --release -p cargo-trace-check -- check \
            --contract crypto::lookup::substitute_mode --cases 50 \
            --config /tmp/m6-security.toml
          code=$?
          set -e
          test "$code" = "1" || {
            echo "a leak in a function declared constant-time must exit 1, got $code"
            exit 1; }

      # The milestone's effectiveness claim, measured rather than asserted: the
      # generated workflow must find a leak the hand-written check does not.
      - name: Generated testing beats the hand-written check
        run: python3 ci/benchmark-m6.py

      # ------------------------------------------------------------------
      # M7: coverage-guided leakage discovery.
      # ------------------------------------------------------------------

      # The milestone's acceptance claim, as the two halves that make it a
      # claim: the same contract and budget, with exploration as the only
      # difference. `--no-explore` is what keeps the comparison fair -- the
      # library's own configuration is read in both runs.
      #
      # Without exploration the leak is real and unreached, so the honest
      # result is NO_LEAK_OBSERVED and the analyzer-regression fixture's
      # declared LEAK_DETECTED goes unmet: exit 2, not 0.
      - name: The hidden path is out of reach without coverage feedback
        working-directory: examples/crypto-library
        run: |
          set +e
          cargo run --locked --release -p cargo-trace-check -- check \
            --contract crypto::hidden::nested_modes --no-explore \
            > "$GITHUB_WORKSPACE/m7-without.txt"
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/m7-without.txt"
          test "$code" = "2" || {
            echo "without exploration this fixture must be unmet (exit 2), got $code"
            exit 1; }
          grep -q NO_LEAK_OBSERVED "$GITHUB_WORKSPACE/m7-without.txt"
          # `grep -v -q` is not this check: it succeeds whenever *any* line
          # fails to match, which is always. Negate the match instead.
          if grep -q -- "-- exploration" "$GITHUB_WORKSPACE/m7-without.txt"; then
            echo "a run without --explore reported an exploration section"
            exit 1
          fi

      - name: Coverage feedback reaches it, and Memcheck confirms it
        working-directory: examples/crypto-library
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- check \
            --contract crypto::hidden::nested_modes --explore \
            | tee "$GITHUB_WORKSPACE/m7-with.txt"
          grep -q LEAK_DETECTED "$GITHUB_WORKSPACE/m7-with.txt"
          # Attributed to the library's own secret-indexed load, and traceable
          # back to the candidate that produced the input.
          grep -q 'hidden.rs:63' "$GITHUB_WORKSPACE/m7-with.txt"
          grep -q 'input from:' "$GITHUB_WORKSPACE/m7-with.txt"

      # A run asked to explore that cannot explore must fail. Falling back to
      # M6 generation would report a search it did not perform.
      - name: Missing coverage tools fail the run rather than falling back
        working-directory: examples/crypto-library
        run: |
          set +e
          TRACE_CHECK_LLVM_TOOLS=/nonexistent/llvm \
            cargo run --locked --release -p cargo-trace-check -- check \
              --contract crypto::lookup::substitute --cases 64 --explore \
              > /tmp/m7-no-tools.txt 2>&1
          code=$?
          set -e
          cat /tmp/m7-no-tools.txt
          test "$code" != "0" || { echo "a run that could not explore passed"; exit 1; }
          grep -qE 'llvm-profdata|llvm-cov' /tmp/m7-no-tools.txt
          if grep -q NO_LEAK_OBSERVED /tmp/m7-no-tools.txt; then
            echo "a failed exploration produced a clean security claim"
            exit 1
          fi

      # A misspelled contract must be diagnosed as a contract problem, not as a
      # missing coverage tool. The same ordering M5 and M6 settled on, extended
      # to a third backend and asserted with that backend unreachable.
      - name: A bad contract is diagnosed before the coverage backend
        working-directory: examples/crypto-library
        run: |
          set +e
          TRACE_CHECK_LLVM_TOOLS=/nonexistent/llvm \
            cargo run --locked --release -p cargo-trace-check -- check \
              --contract crypto::hidden::no_such_function --explore \
              > /tmp/m7-bad-contract.txt 2>&1
          code=$?
          set -e
          cat /tmp/m7-bad-contract.txt
          test "$code" != "0" || { echo "a missing contract passed"; exit 1; }
          grep -q no_such_function /tmp/m7-bad-contract.txt
          if grep -qE 'llvm-profdata|llvm-cov' /tmp/m7-bad-contract.txt; then
            echo "a bad contract was reported as a missing coverage tool"
            exit 1
          fi

      # The acceptance threshold from docs/MILESTONE-07.md section 12: at least
      # two additional confirmed discoveries over M6's default generation, none
      # lost, and no finding on a clean control. `--quick` uses the reduced
      # fixture set; Valgrind dominates the wall clock and the full set is
      # mostly more of the same measurement.
      - name: Coverage-guided discovery beats M6 generation
        run: python3 ci/benchmark-m7.py --quick --skip-cold

      # ------------------------------------------------------------------
      # M8: complete contract coverage and enforcement.
      # ------------------------------------------------------------------

      # The inventory comes from the compiled library, so it finds contracts
      # that no configuration names and that have no test adapter. Asserted
      # against the out-of-workspace annotation-only library, which is the case
      # M3's test-metadata discovery could not see at all.
      - name: Contracts are discovered from the compiled library
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- list --contracts \
            --manifest-path examples/external-library/Cargo.toml | tee /tmp/m8-external.txt
          grep -q '3 contract declaration(s)' /tmp/m8-external.txt
          grep -q 'external_library::digest_nibble' /tmp/m8-external.txt
          # Annotation-only: no adapter, and still inventoried.
          grep -q 'declared dynamic = false' /tmp/m8-external.txt

      # Every declaration enforced, with the report's own claims validated
      # rather than the exit code: the inventory complete and artifact-bound,
      # every requirement carrying a status, nothing NOT_SELECTED, and no
      # waiver covering a detected leak.
      - name: Every declared contract is enforced
        working-directory: examples/crypto-library
        run: |
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-contracts --ci --format json \
            > "$GITHUB_WORKSPACE/m8-contracts.json"
          python3 "$GITHUB_WORKSPACE/ci/verify-m8-contracts.py" \
            "$GITHUB_WORKSPACE/m8-contracts.json" --expect-declared 18

      # The milestone's defining property, asserted against the checkout rather
      # than only inside the test binary: annotate a vulnerable function,
      # change no configuration, and CI must fail.
      - name: A new leaking annotation fails CI with no configuration change
        run: |
          set -euo pipefail
          work=/tmp/m8-mutation
          rm -rf "$work" && mkdir -p "$work/src"
          sed "s#path = \"../../crates/trace-check-macros\"#path = \"$GITHUB_WORKSPACE/crates/trace-check-macros\"#" \
            examples/enforcement-fixture/Cargo.toml > "$work/Cargo.toml"
          cp examples/enforcement-fixture/src/lib.rs "$work/src/lib.rs"
          test ! -f "$work/trace-check.toml"

          # Clean to begin with.
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-contracts --ci --manifest-path "$work/Cargo.toml" \
            | tee /tmp/m8-before.txt
          grep -q 'declared: 2 contract(s)' /tmp/m8-before.txt
          grep -q 'Result: PASS' /tmp/m8-before.txt

          # Annotate a secret-indexed load. Nothing else changes.
          # The heredoc body sits at the YAML block's own indentation, which
          # YAML strips, so the shell receives it unindented. A `sed` dedent
          # afterwards would also reach the fixture's existing lines.
          cat >> "$work/src/lib.rs" <<'RUST'

          #[constant_time(secret = "index", dynamic = false)]
          pub fn indexed(index: u8) -> u8 {
              // SAFETY: the mask keeps the index inside the 16-byte table.
              unsafe { core::ptr::read_volatile(&TABLE[(index & 15) as usize]) }
          }
          RUST
          test ! -f "$work/trace-check.toml"

          set +e
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-contracts --ci --manifest-path "$work/Cargo.toml" \
            > /tmp/m8-after.txt
          code=$?
          set -e
          cat /tmp/m8-after.txt
          test "$code" = "1" || {
            echo "a newly annotated leaking function must exit 1, got $code"
            exit 1; }
          grep -q 'declared: 3 contract(s)' /tmp/m8-after.txt
          grep -q 'fixture::indexed' /tmp/m8-after.txt
          grep -q 'LEAK_DETECTED' /tmp/m8-after.txt
          test ! -f "$work/trace-check.toml"

      # An unanalyzable declaration is visible and fails, rather than passing
      # because no harness could be built for it.
      - name: An unsupported declaration fails as unsupported
        run: |
          set -euo pipefail
          work=/tmp/m8-unsupported
          rm -rf "$work" && mkdir -p "$work/src"
          sed "s#path = \"../../crates/trace-check-macros\"#path = \"$GITHUB_WORKSPACE/crates/trace-check-macros\"#" \
            examples/enforcement-fixture/Cargo.toml > "$work/Cargo.toml"
          cp examples/enforcement-fixture/src/lib.rs "$work/src/lib.rs"
          cat >> "$work/src/lib.rs" <<'RUST'

          #[constant_time(secret = "flag", dynamic = false)]
          pub fn over_bool(flag: bool) -> u8 {
              if flag { 1 } else { 0 }
          }
          RUST
          set +e
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-contracts --ci --manifest-path "$work/Cargo.toml" > /tmp/m8-unsup.txt
          code=$?
          set -e
          cat /tmp/m8-unsup.txt
          test "$code" = "2" || { echo "expected exit 2 (unsupported), got $code"; exit 1; }
          grep -q 'UNSUPPORTED' /tmp/m8-unsup.txt
          grep -q 'secret `bool`' /tmp/m8-unsup.txt

      # Discovery must stay a fixed cost rather than scaling with the number of
      # annotations, or enforcing every contract becomes the reason not to.
      - name: Contract discovery overhead is bounded
        run: python3 ci/benchmark-m8.py

      # ------------------------------------------------------------------
      # M9 level 1: the real-library integration, on every PR.
      # ------------------------------------------------------------------

      # The gate that makes a clean result on the real operation mean anything.
      # All six controls must be *detected*: they are declared
      # `expected_outcome = "LEAK_DETECTED"`, so a control that stops being
      # detected fails on an unmet expectation rather than inflating the clean
      # count. The report's own claims are asserted, not the exit code.
      - name: Secrets survive decoding into crypto-bigint's own types
        working-directory: examples/crypto-bigint-audit
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- check \
            --all-contracts --ci --format json \
            > "$GITHUB_WORKSPACE/m9-contracts.json"
          python3 "$GITHUB_WORKSPACE/ci/verify-m8-contracts.py" \
            "$GITHUB_WORKSPACE/m9-contracts.json" --expect-declared 13
          python3 "$GITHUB_WORKSPACE/ci/verify-m9-integration.py" \
            "$GITHUB_WORKSPACE/m9-contracts.json"

      - name: Reproduce the demonstration
        run: cargo run --locked --release -p trace-check -- demo mac-compare

      - name: Emit the JSON reports
        run: |
          cargo run --locked --release -p trace-check -- demo mac-compare --format json \
            > mac-compare-report.json
          cargo run --locked --release -p trace-check -- screen mac-compare --format json \
            > mac-compare-screen.json
          cargo run --locked --release -p trace-check -- native --format json \
            > native-memcheck.json

      - uses: actions/upload-artifact@v4
        with:
          name: mac-compare-report
          path: |
            mac-compare-report.json
            mac-compare-screen.json
            native-memcheck.json
            m6-generated.json
            m8-contracts.json
            m9-contracts.json

  # M9 level 2: the upstream-mutation experiments. A separate job because each
  # one stages its own copy of the dependency and analyzes it under Valgrind,
  # and because a mutation regression must not be able to mask an M1-M8
  # regression or be masked by one.
  #
  # Never a shared dependency directory: each experiment stages into its own
  # temporary tree, so no run can be compiling a source file another run is
  # rewriting, and the clean baseline can never reuse the mutated build.
  mutate:
    name: Upstream mutation experiments (crypto-bigint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          test -f /usr/include/valgrind/memcheck.h

      - uses: Swatinem/rust-cache@v2

      # The decisive experiments: the library's own source changes, the adapter
      # and its contract do not, and the verdict has to flip. `--compare-clean`
      # also requires the two runs to have analyzed different artifacts, and
      # `--expect-frame` requires the finding to name the file the patch
      # touched -- a finding in the adapter would not satisfy it.
      #
      # `--expect-class` is not decoration. A tool that only saw branches would
      # report mutation C's secret-indexed load as clean, so the three
      # experiments are required to cover both halves of the observation model.
      - name: Mutation A -- a branch on the carry inside Uint::carrying_add
        run: |
          python3 ci/mutate-m9.py --mutation mutation-a-carry-branch \
            --contract cbaudit::add::wrapping_add_secret_left \
            --expect-outcome LEAK_DETECTED \
            --expect-frame src/uint/add.rs \
            --expect-class branch \
            --compare-clean

      - name: Mutation B -- a branch inside the library's own CtSelect
        run: |
          python3 ci/mutate-m9.py --mutation mutation-b-branch-select \
            --contract cbaudit::select::ct_select \
            --expect-outcome LEAK_DETECTED \
            --expect-frame src/uint/ct.rs \
            --expect-class branch \
            --compare-clean

      # The address-dependency experiment, and the one whose finding is also
      # replayed: a reproducer that does not reproduce against the same
      # artifact reads as an actionable diagnostic and is not one.
      - name: Mutation C -- a secret-indexed load inside the Montgomery reduction
        run: |
          python3 ci/mutate-m9.py --mutation mutation-c-indexed-reduction \
            --contract cbaudit::monty::mul_secret_left \
            --expect-outcome LEAK_DETECTED \
            --expect-frame src/modular/mul.rs \
            --expect-class address \
            --verify-reproducer \
            --compare-clean

      # Two ways the experiment above could report an outcome it did not earn.
      # Both must fail, and a `python3` exit of 1 is the pass condition here.
      - name: A stale patch fails rather than reporting a clean result
        run: |
          set +e
          python3 ci/mutate-m9.py --mutation negative-stale-patch \
            --contract cbaudit::add::wrapping_add_secret_left \
            --expect-outcome LEAK_DETECTED > /tmp/m9-stale.txt 2>&1
          code=$?
          set -e
          cat /tmp/m9-stale.txt
          test "$code" = "1" || { echo "a stale patch must fail, got $code"; exit 1; }
          grep -q "does not apply to crypto-bigint 0.7.10" /tmp/m9-stale.txt

      - name: A mutation in code that never runs cannot be claimed as a finding
        run: |
          set +e
          python3 ci/mutate-m9.py --mutation negative-unreached-branch \
            --contract cbaudit::add::wrapping_add_secret_left \
            --expect-outcome LEAK_DETECTED > /tmp/m9-unreached.txt 2>&1
          code=$?
          set -e
          cat /tmp/m9-unreached.txt
          test "$code" = "1" || { echo "an unexecuted mutation must fail, got $code"; exit 1; }
          grep -q "expected LEAK_DETECTED, got NO_LEAK_OBSERVED" /tmp/m9-unreached.txt

  # M4: bounded relational verification. A separate job because its backend is
  # a container image rather than a package, and because it must not be able to
  # mask an M1-M3 regression or be masked by one.
  verify:
    name: Bounded relational verification (BINSEC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Pinned by digest, so the analyzer and its bundled solver are one
      # reproducible artifact. A tag could change underneath a recorded result.
      #
      # Deliberately pulled into Docker only, while Podman stays installed and
      # probes first. That is the exact configuration that made this job fail:
      # the runner must select the runtime that *holds* the image, not the one
      # that appears first. The assertion below keeps the regression covered,
      # and verify-m4-symbolic.py checks the report agrees.
      - name: Pull the pinned analyzer image (Docker only)
        run: |
          set -euo pipefail
          docker pull "${ANALYZER_IMAGE}"
          docker image inspect "${ANALYZER_IMAGE}" > /dev/null
          echo "analyzer build: $(docker run --rm "${ANALYZER_IMAGE}" binsec -version)"
          if ! command -v podman > /dev/null; then
            echo "podman is absent, so runtime selection is not being exercised here"
            exit 1
          fi
          if podman image inspect "${ANALYZER_IMAGE}" > /dev/null 2>&1; then
            echo "podman also has the image; the selection regression is not covered"
            exit 1
          fi

      # The solver is linked into the analyzer rather than invoked as a
      # subprocess, so pinning the image digest pins the solver too. Asserted
      # here: no external solver binary is what makes that claim true.
      - name: Record the solver
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "${ANALYZER_IMAGE}" -c '
            strings -a /usr/bin/binsec | grep -oE "bitwuzla-c\.[0-9.]+" | sort -u
            strings -a /usr/bin/binsec | grep -oiE "cadical-[0-9.]+" | sort -u
            for solver in z3 bitwuzla cvc4 cvc5 yices boolector; do
              if command -v "$solver" > /dev/null; then
                echo "unexpected external solver on PATH: $solver"
                exit 1
              fi
            done'

      # TRACE_CHECK_REQUIRE_SYMBOLIC makes a missing analyzer a failure, so a
      # skipped verification can never be reported as a pass.
      - name: Symbolic backend tests
        env:
          TRACE_CHECK_REQUIRE_SYMBOLIC: "1"
          EXPECTED_CONTAINER_RUNTIME: docker
        run: |
          cargo test --locked -p trace-check --test symbolic
          cargo test --locked -p cargo-trace-check --test verify

      # M5: contract verification against a real Cargo library. Includes
      # `the_verdict_follows_the_library_implementation`, which rewrites one
      # function body in a copy of the library and requires the verdict to flip
      # while the configuration and the generated harness design stay the same.
      - name: Contract verification tests
        env:
          TRACE_CHECK_REQUIRE_SYMBOLIC: "1"
          EXPECTED_CONTAINER_RUNTIME: docker
        run: cargo test --locked -p trace-check --test library

      # No --container-runtime here on purpose: automatic selection is what
      # must work.
      - name: Verify every bundled case
        env:
          EXPECTED_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- verify
          cargo run --locked --release -p cargo-trace-check -- verify --format json \
            > m4-symbolic.json
          python3 ci/verify-m4-symbolic.py m4-symbolic.json

      # The explicit override is part of the interface, so it is exercised too.
      - name: Honor an explicit container runtime
        run: |
          cargo run --locked --release -p cargo-trace-check -- verify \
            --case masked-scan --container-runtime docker

      # M5: every declared contract in the example library, through the CLI a
      # developer uses. The validator checks the report, not the exit code.
      - name: Verify every declared contract in the example library
        env:
          EXPECTED_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- verify --all-contracts \
            --manifest-path examples/crypto-library/Cargo.toml
          cargo run --locked --release -p cargo-trace-check -- verify --all-contracts \
            --manifest-path examples/crypto-library/Cargo.toml --format json \
            > m5-library.json
          python3 ci/verify-m5-library.py m5-library.json

      # The workflow has to work for a crate trace-check knows nothing about:
      # its own manifest, its own lockfile, no workspace membership. Its
      # `mix_when` contract also takes a public `bool`, whose domain the
      # generator must restrict to Rust's two valid values -- a symbolic byte
      # has 256, and a report that did not say so would describe a domain that
      # was not the one searched.
      - name: Verify a library outside the workspace
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- verify --all-contracts \
            --manifest-path examples/external-library/Cargo.toml | tee m5-external.txt
          grep -q 'generated: TC_PUBLIC_ENABLED <= 1' m5-external.txt

      # M9.6: the same thirteen contracts the dynamic job checks, through the
      # symbolic backend. The point of running it here is not the five clean
      # rows -- it is that the seven controls still come back LEAK_DETECTED and
      # nothing comes back INCONCLUSIVE. A control that verified clean would
      # mean the secret stopped being symbolic inside the library's decode, and
      # then every clean row in the matrix would be worthless.
      #
      # This also covers the link fix M9 needed: before it, a freestanding
      # artifact for any library with more than one dependency failed with
      # `undefined symbol: rust_eh_personality` and never reached the analyzer.
      - name: Verify the real-library audit contracts
        env:
          EXPECTED_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          cargo run --locked --release -p cargo-trace-check -- verify --all-contracts \
            --manifest-path examples/crypto-bigint-audit/Cargo.toml | tee m9-symbolic.txt
          grep -q 'Summary: 6 verified bounded, 7 leak detected, 0 inconclusive' m9-symbolic.txt
          grep -q 'Every declared expectation was reproduced' m9-symbolic.txt

      # The milestone's defining property, asserted against the checkout rather
      # than only inside the test binary: change the library's actual
      # implementation, leave the harness design and the configuration alone,
      # and the verdict must change.
      - name: Changing the library changes the verdict
        run: |
          set -euo pipefail
          sed -i 's/read_volatile(&SBOX\[position as usize\])/read_volatile(\&SBOX[want as usize])/' \
            examples/crypto-library/src/lookup.rs
          if git diff --quiet examples/crypto-library/src/lookup.rs; then
            echo "the injection site no longer exists"
            exit 1
          fi
          set +e
          cargo run --locked --release -p cargo-trace-check -- verify \
            --contract crypto::lookup::substitute \
            --manifest-path examples/crypto-library/Cargo.toml
          code=$?
          set -e
          git checkout -- examples/crypto-library/src/lookup.rs
          test "$code" = "1" || {
            echo "a secret-indexed load must be found even though the contract declares"
            echo "VERIFIED_BOUNDED; expected exit 1, got $code"
            exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: m4-symbolic-report
          path: m4-symbolic.json

      - uses: actions/upload-artifact@v4
        with:
          name: m5-library-report
          path: m5-library.json
